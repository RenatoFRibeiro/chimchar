<!DOCTYPE html>
<html>
<head>
    <title>Resume List</title>
</head>
<body>
    <h2>Resume List</h2>
    <ul>
        {% for resume in resumes %}
            <li>
                <strong>File:</strong> {{ resume.file.name }}<br>
                <strong>Uploaded At:</strong> {{ resume.uploaded_at }}<br>
                <strong>Skills:</strong> {{ resume.skills }}<br>
                <strong>Experience:</strong> {{ resume.experience }}<br>
                <strong>Education:</strong> {{ resume.education }}<br>
                <a href="{% url 'matched_jobs' resume.id %}"><button>View Matched Jobs</button></a>
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'homepage' %}"><button>Back to Homepage</button></a>
</body>
</html>
